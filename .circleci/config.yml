version: 2.1

# Seede XR Monitor CI/CD
# Flow: develop on `dev` → open a PR to `main`.
#   - `test` runs the full suite on dev / feature branches (and the PR) and reports
#     its status to GitHub via the CircleCI GitHub App.
#   - GitHub's native auto-merge (branch protection requires this check) merges the
#     PR when the check is green — no token, no merge job here.
#   - the resulting push to `main` is auto-deployed by Coolify.
#
# No CircleCI env vars required.

executors:
  linux-vm:
    # A real VM (not a container) so Testcontainers-based backend tests and
    # Playwright browsers have a working Docker daemon + system deps.
    machine:
      image: ubuntu-2404:current
    resource_class: large

jobs:
  test:
    executor: linux-vm
    steps:
      - checkout
      - run:
          name: Install Node 22
          command: |
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
            node -v && npm -v
      - run:
          name: Install dependencies
          # --legacy-peer-deps: the tree has a peer conflict (@hey-api/openapi-ts
          # wants TS>=5.5, project pins typescript@4.4.4) that npm rejects otherwise.
          command: npm ci --legacy-peer-deps
      - run:
          name: Lint (ESLint + Stylelint)
          command: npm run lint:prod
      - run:
          name: Build frontend
          command: npm run build
      - run:
          name: Backend tests (node:test + Testcontainers)
          command: npm run test-backend
          environment:
            HEADLESS_TEST: "1"
      - run:
          name: Install Playwright (Chromium)
          command: npx playwright install --with-deps chromium
      - run:
          name: E2E tests (Seede feature specs)
          command: npx playwright test --config ./config/playwright.config.js branding.spec.js users.spec.js shared-admin.spec.js

workflows:
  ci-cd:
    jobs:
      # Test dev / feature branches and PRs. GitHub's native auto-merge (with branch
      # protection requiring this check) merges the dev→main PR when it goes green.
      # main is not tested here — Coolify deploys the merge, and the code was already
      # validated on dev before the merge.
      - test:
          filters:
            branches:
              ignore: main
